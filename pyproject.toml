# Tooling configuration only.
#
# This project is an application (not a distributable library), so no
# [build-system] / [project] table is defined on purpose: `pip install .`
# is not supported, and the application is run from the repository root
# via `python run.py <command>`.
#
# Dependencies live in requirements.txt, which is also what CI installs.

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "data",
]

[tool.ruff.lint]
# Conservative rule set: correctness + import hygiene only.
select = ["E", "F", "W", "I", "B"]
# Long Chinese comments/docstrings are intentional; do not fail on line length.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately import inside test bodies and use long literal fixtures.
"tests/*" = ["B011"]
