name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    # Windows is the primary target platform: the application is a local
    # desktop tool and src/files/path_resolver.py implements Windows-specific
    # path handling (drive letters, backslashes, illegal filename chars).
    # At least one test asserts that a "Z:/..." path is treated as absolute,
    # which only holds on Windows. Add a ubuntu job once the suite is made
    # fully platform-agnostic.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show environment
        run: |
          python --version
          python -m pip list

      - name: Run test suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests -q
